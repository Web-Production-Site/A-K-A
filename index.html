<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-K-A | تشفير</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>A-K-A</h1>
            <p class="subtitle">نظام التشفير</p>
        </header>

        <main class="main-content">
            <section class="input-section">
                <label for="inputText">أدخل الرسالة</label>
                <textarea id="inputText" placeholder="اكتب رسالتك هنا..."></textarea>
                <button id="encryptBtn" class="btn-primary">تشفير</button>
            </section>

            <section id="resultSection" class="result-section hidden">
                <label>الرسالة المشفرة</label>
                <div id="outputText" class="output-box"></div>
                
                <div class="button-group">
                    <button id="copyTextBtn" class="btn-secondary">نسخ الرسالة</button>
                    <button id="openDecodeBtn" class="btn-secondary">فتح نافذة الفك</button>
                </div>
                
                <button id="newEncryptBtn" class="btn-tertiary">رسالة جديدة</button>
            </section>
        </main>

        <footer class="footer">
            <p>يدعم جميع اللغات</p>
        </footer>
    </div>

    <div id="toast" class="toast"></div>

    <script src="encrypt.js"></script>
</body>
</html>
