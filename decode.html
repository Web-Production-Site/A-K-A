<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-K-A | فك التشفير</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>A-K-A</h1>
            <p class="subtitle">فك التشفير</p>
        </header>

        <main class="main-content">
            <section class="input-section">
                <label for="inputCipher">الصق الرسالة المشفرة</label>
                <textarea id="inputCipher" placeholder="الصق الرسالة هنا..."></textarea>
                <button id="decryptBtn" class="btn-primary">فك التشفير</button>
            </section>

            <section id="decryptedSection" class="result-section hidden">
                <label>الرسالة الأصلية</label>
                <div id="outputDecrypted" class="output-box"></div>
                
                <div class="button-group">
                    <button id="copyDecryptedBtn" class="btn-secondary">نسخ الرسالة</button>
                    <button id="copyPageLinkBtn" class="btn-secondary">نسخ رابط الصفحة</button>
                </div>
                
                <button id="newMessageBtn" class="btn-tertiary">رسالة جديدة</button>
            </section>
        </main>

        <footer class="footer">
            <p>النظام جاهز</p>
        </footer>
    </div>

    <div id="toast" class="toast"></div>

    <script src="decrypt.js"></script>
</body>
</html>
